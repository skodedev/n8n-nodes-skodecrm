name: Publish to npm (with provenance)

# n8n verified-node rule (from 1 May 2026): verified nodes MUST be published
# from CI with an npm provenance statement — not from a local machine. This
# workflow does exactly that. Publishing is triggered by pushing a version tag.
#
# One-time setup:
#   1. npm token: repo Settings → Secrets → Actions → NPM_TOKEN (an Automation
#      token from npmjs.com; provenance needs a token, not just OIDC).
#   2. The npm account must have 2FA set to "auth only" (or use a granular
#      automation token) so CI can publish.
# Release:  npm version patch  &&  git push --follow-tags

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      # --ignore-scripts is load-bearing, not a speed tweak. n8n-workflow pulls
      # @n8n/expression-runtime -> isolated-vm, a native addon that fails to
      # compile against Node 20's V8 ("'SourceLocation' in namespace 'v8' does
      # not name a type") and killed the first two release runs. We depend on
      # n8n-workflow for TYPES ONLY — nothing here executes it — so skipping
      # install scripts removes the compile entirely. Verified: tsc and eslint
      # both still pass with it.
      - run: npm ci --ignore-scripts

      # Official n8n toolchain — the same lint the Creator Portal
      # pre-check runs. A local pass here is what verification checks.
      - run: npm run build

      - run: npm run lint

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
